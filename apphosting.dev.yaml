# DEV 環境（backend 的 Environment name = dev）：Firebase 專案 oingg-web-dev、上線分支 development、業務中台 oingg-business-ts-dev
#（2026-10-14 起在業務中台專屬的 GCP 專案 oingg-business；舊專案 oingg-bff 的網址已停用）。
# 區域：App Hosting 的 backend 開在 asia-east1（台灣），業務中台與資料庫在 asia-southeast1（新加坡）。使用者 2026-10-14 選台灣：
# 快取命中的頁面讀者到伺服器最近；快取沒命中時伺服器到業務中台要跨區（每層多一次台灣↔新加坡來回，約 40～50 ms），差距是幾十毫秒的等級。
#
# NUXT_BUSINESS_AUDIENCE 一定要跟 NUXT_BUSINESS_BASE 同一個網址、不含路徑（業務中台：audience 要跟實際呼叫的網址一致）。
# Firebase web config 是公開值（本來就寫在每一頁的 JS 裡），可以進版控；共享金鑰只參照 Secret Manager，值不進版控。
env:
  - variable: NUXT_BUSINESS_BASE
    value: https://oingg-business-ts-dev-xradmqyx5q-as.a.run.app
    availability: [RUNTIME]
  - variable: NUXT_BUSINESS_AUDIENCE
    value: https://oingg-business-ts-dev-xradmqyx5q-as.a.run.app
    availability: [RUNTIME]
  # 業務中台 DEV 的共享金鑰，直接讀業務中台專案裡的那一把（2026-10-14 使用者決定：不複製金鑰，由業務中台保管，授權我們的執行身分
  # firebase-app-hosting-compute@oingg-web-dev 讀取）。原本自己存的 businessNitroKey 跟業務中台的值不同，驗不過——所有訪客會被當成
  # Nitro 的同一個出口 IP，共用業務中台的限流額度。
  - variable: NUXT_BUSINESS_NITRO_KEY
    secret: projects/oingg-business/secrets/NITRO_SHARED_SECRET_DEV
    availability: [RUNTIME]
  # @nuxtjs/robots：非 production 的 site env 一律不給索引
  - variable: NUXT_SITE_ENV
    value: preview
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyD_fVz_HBT2USKSLCrJ17tBcAEE5DgrPUo"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "oingg-web-dev.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "oingg-web-dev"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "oingg-web-dev.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "358046545416"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_APP_ID
    value: "1:358046545416:web:875cc4888a65d9c7a9c3bd"
    availability: [BUILD, RUNTIME]
  - variable: NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-FC52QRB5NP"
    availability: [BUILD, RUNTIME]
