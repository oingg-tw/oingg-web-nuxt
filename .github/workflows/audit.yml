# 每週的依賴安全檢查（2026-10-27，使用者核准 Dependabot 檢查的修正）：pnpm audit --prod 有 high 以上就讓這次執行失敗，GitHub 會寄信。
# 只放 schedule（可手動 workflow_dispatch），不進 PR 的 checks：新揭露的漏洞跟 PR 無關，不該擋住合併。
# 已接受的幾筆寫在 pnpm-workspace.yaml 的 auditConfig.ignoreGhsas（附原因）。action 用 commit SHA 釘住，同 ci.yml，Dependabot 會更新。
name: Audit

on:
  schedule:
    - cron: '0 1 * * 1' # 每週一 09:00 台北，跟 Dependabot 同一時間
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # 只讀 lockfile，不用 install
      - run: pnpm audit --prod --audit-level=high
