# CI（2026-10-13）：Dependabot 自動合併的前提（使用者選了「加 CI，只自動合併 patch」）。範本是 oingg-mops-ts 的 ci.yml。
#
# 抓得到的：型別錯、lint、正式建置壞掉，以及不需要伺服器的自我檢查腳本。**抓不到的**：畫面壞掉——check-stock-pages 這類
# 瀏覽器檢查要 dev server＋本機業務中台（bff-ts:4000）＋資料，CI 上沒有。所以自動合併只放 patch，minor／major 留給人在本機跑
# 瀏覽器檢查（Element Plus 升個 minor 就可能壞版面）。
#
# Node 24 與 26 都跑、pnpm 11 跟本機一致（本機 26；部署在 App Hosting 提供 26 之前先用 24，使用者 2026-10-14 決定）（scripts/*.mjs 直接 import .ts，靠 Node 內建的型別剝除）。不需要 .env：建置只預先產生 @nuxt/content
# 的內容檔，不打後端。action 用 commit SHA 釘住，Dependabot 的 github-actions 生態系會更新它們。
#
# ## Dependabot 自動合併（第二個 job）
# `needs: checks`：同一次執行裡 checks 通過才會跑，`--match-head-commit` 只合併剛驗證過的那個 commit。
# 只合 semver-patch。dependabot.yml 把 patch 與 minor 分成兩個群組，patch 群組 PR 的等級才會是 patch（群組回報的是組內最大的等級）。
# 預設分支是 development（同日改），所以 Dependabot 的 PR——包括安全性更新——都開到 development；development 不部署，合到 main 一律由人做。
# 安全要點：用 pull_request（不是 pull_request_target）、作者看 pull_request.user.login（不是 github.actor）、寫入權限只給合併 job、
# 合併 job 不 checkout 也不執行 PR 的程式碼。
name: CI

on:
  pull_request:
    # edited（2026-10-13，使用者要求加上；同 oingg-mops-ts 25291bd）：Dependabot 改 PR 的目標分支時只發「edited」，預設的三種事件聽不到，
    # 合併 job 就要等人留言 @dependabot rebase。我們預設分支就是 development、沒用 target-branch，平常不會發生；預設分支哪天改回 main
    # 時才會用到。checks 的 if 只讓「改了 base」的 edited 通過，改標題、改說明不會多跑一次 CI（合併 job needs checks，也跟著略過）。
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [development]

permissions:
  contents: read

# 沒改 base 的 edited（只改標題、說明）用自己的 run_id 當 group：concurrency 在 workflow 層級求值，checks 被 if 跳過的那次執行
# 還是會進同一個 group，cancel-in-progress 會把同一個 PR 正在跑的 checks 砍掉，新的那次又不跑 checks，這一輪就不會自動合併。
# Dependabot rebase 時常順手改說明，所以實際會發生（twse-ts、bff-ts 指出，同 oingg-mops-ts 472ec20）。
concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'edited' && github.event.changes.base == null && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.action != 'edited' || github.event.changes.base != null
    # Node 24 與 26 各跑一次（2026-10-14）：本機是 26，Firebase App Hosting 在 26 進 LTS（10/28）前可能只提供 24，部署先用 24
    strategy:
      matrix:
        node: [24, 26]
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall 跑 nuxt prepare
      # 裸跑 vue-tsc --noEmit 對本專案是零輸出（tsconfig 是 project references），一定要 nuxt typecheck
      - run: pnpm exec nuxt typecheck
      # 規則一律 error（.oxlintrc.json）；--deny-warnings 是最後一道防線：哪天有規則被設成 warn 也擋得住（2026-10-13）
      - run: pnpm lint
      - run: pnpm build
      # 開機測試（2026-10-13，使用者核准；oingg-mops-ts 推廣的做法）：建置得出來不等於跑得起來——Nuxt 4.6.1 建置時就出過
      # 「cache-driver.mjs 解析不到、當成外部依賴」的警告，這類問題只有真的啟動才會炸。不另寫狀態端點：/accessibility 不需要業務中台，
      # 本機實測把 NUXT_BUSINESS_BASE 指到連不到的位址、不帶 .env，啟動到第一個 200 約 1.2 秒。印出啟動時間，30 秒內沒有 200 就失敗。
      - name: 開機測試（正式伺服器起得來）
        run: |
          PORT=3000 NUXT_BUSINESS_BASE=http://127.0.0.1:9 node .output/server/index.mjs > server.log 2>&1 &
          start=$(date +%s%N)
          for i in $(seq 1 60); do
            if curl -sf -o page.html http://127.0.0.1:3000/accessibility; then
              echo "Server startup to first 200: $(( ($(date +%s%N) - start) / 1000000 ))ms"
              grep -q '<h1' page.html || { echo "::error::/accessibility 回 200 但沒有 h1"; exit 1; }
              # 起得來之後再打一輪主要頁面（2026-10-14）：/screener 在正式建置下 500（Pragmatic DnD 的 CJS 被打進伺服器 bundle，
              # 見 useElTableColumnDrag.ts），只打 /accessibility 抓不到；App Hosting DEV 上線才發現。這些頁在業務中台連不到時仍應回 200
              #（本機實測；/industries、/learn/{指標} 拿不到型錄時回 503 是設計，不列）。
              failed=0
              for path in / /screener /screener/common /watchlist /stock/2330 /stock/2330/roe /screener/etf /screener/preferred /preferred /rank /macro /learn /calendar /holdings /guru-indicators; do
                code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "http://127.0.0.1:3000$path")
                echo "$code $path"
                [ "$code" = 200 ] || { echo "::error::$path 回 $code"; failed=1; }
              done
              # 壓縮（2026-10-16 Lighthouse 量到 DEV 全部原樣傳）：動態的 HTML 走 server/plugins/compress-responses.ts，
              # 靜態的 JS 走 nitro.compressPublicAssets，兩邊都要帶 Content-Encoding
              js=$(grep -o '/_nuxt/[A-Za-z0-9_-]*\.js' page.html | head -1)
              for url in /accessibility "$js"; do
                enc=$(curl -s -o /dev/null -D - -H 'Accept-Encoding: br, gzip' "http://127.0.0.1:3000$url" | tr -d '\r' | grep -i '^content-encoding:')
                echo "$url $enc"
                [ -n "$enc" ] || { echo "::error::$url 沒有壓縮"; failed=1; }
              done
              [ "$failed" = 0 ] || { cat server.log; exit 1; }
              exit 0
            fi
            sleep 0.5
          done
          cat server.log
          echo "::error::正式伺服器 30 秒內沒有回 200"
          exit 1
      # 不需要伺服器的自我檢查；清單在 package.json 的 selfcheck，跟 .githooks/pre-push 共用
      - run: pnpm selfcheck

  dependabot-merge:
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
